name: codeql
on:
  push:
    branches: [master]
  pull_request:
  # Monday 03:00 UTC.
  schedule:
    - cron: '0 3 * * 1'
permissions:
  contents: read
concurrency:
  group: codeql-${{ github.ref }}
  cancel-in-progress: true
jobs:
  analyze:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      security-events: write
    strategy:
      fail-fast: false
      matrix:
        language: [go, javascript-typescript]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e  # v7
        if: matrix.language == 'go'
        with:
          go-version: '1.26.11'
      - uses: github/codeql-action/init@1bd86f2fdb4b86187fa4059f16f31a3202acc9ea  # v4.39.4
        with:
          languages: ${{ matrix.language }}
          queries: security-extended
          config-file: ./.github/codeql/codeql-config.yml
      - uses: github/codeql-action/autobuild@1bd86f2fdb4b86187fa4059f16f31a3202acc9ea  # v4.39.4
        if: matrix.language == 'go'
      - uses: github/codeql-action/analyze@1bd86f2fdb4b86187fa4059f16f31a3202acc9ea  # v4.39.4
        with:
          category: /language:${{ matrix.language }}
          upload: never
          output: sarif-out
      - run: |
          for f in sarif-out/*.sarif; do echo "$f"; jq -r '[.runs[].results[]|.ruleId]|group_by(.)|map("\(.[0]) \(length)")|.[]' "$f"; done
